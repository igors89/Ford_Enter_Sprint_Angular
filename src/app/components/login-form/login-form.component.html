<form class="p-3 row h-100" (ngSubmit)="login()">
  <div class="input-group mb-3 col-12">
    <span class="input-group-text" id="usericon">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
      </svg>
    </span>
    <input type="text" class="form-control" id="usuario" [(ngModel)]="loginForm.nome" name="nome" placeholder="Usuário" aria-label="usuario" aria-describedby="usericon">
  </div>
  <div class="input-group mb-3">
    <span class="input-group-text" id="pswdicon">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4M4.5 7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7zM8 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
      </svg>
    </span>
    <input type="password" class="form-control" id="senha" [(ngModel)]="loginForm.senha" name="senha" placeholder="Senha" aria-label="senha" aria-describedby="pswdicon">
  </div>
  <div class="form-check form-switch mb-3 ps-5">
    <input class="form-check-input" type="checkbox" role="switch" id="login-auto">
    <label class="form-check-label" for="login-auto">Logar automaticamente</label>
  </div>
  <div *ngIf="errorMessage">{{errorMessage}}</div>
  <div class="form-check form-switch mb-3 w-100 ps-4 row">
    <button type="submit" class="btn btn-primary ">Entrar</button>
  </div>
</form>
