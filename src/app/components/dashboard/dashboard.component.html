<div class="d-flex flex-column vh-100 overflow-hidden">
    <app-cabecalho class="flex-shrink-0"></app-cabecalho>
    <div class="flex-grow-1" style="min-height: 0;">
        <div class="px-md-4 px-2 py-3 d-flex flex-column gap-2 text-center h-100">
            <section class="d-flex justify-content-center h2">
                <p style="color: #1b357e">Dashboard FORD</p>
            </section>
            <section class="d-flex flex-lg-row flex-column gap-3 flex-shrink-0 justify-content-around h-auto">
                <div class="card shadow h-100">
                    <p class="h5 card-header d-flex align-items-center flex-wrap justify-content-center">Veículos</p>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <select (change)="onSelectChange($event)">
                            <option *ngFor="let v of veiculos" value="{{v.id}}">{{v.vehicle}}</option>
                        </select>
                    </div>
                </div>

                <app-card [titulo]="'Total de vendas'" [valor]="veiculoSelecionado.volumetotal"/>
                <app-card [titulo]="'Conectados'" [valor]="veiculoSelecionado.connected"/>
                <app-card [titulo]="'Upd. de Software'" [valor]="veiculoSelecionado.softwareUpdates"/>
            </section>

            <section class="flex-grow-1 d-flex justify-content-center align-items-center" style="min-height: 300px;">
                <img class="img-fluid h-100 object-fit-contain" src="{{veiculoSelecionado.img}}" alt="{{veiculoSelecionado.vehicle}}">
            </section>

            <section class="w-100 flex-shrink-0">
                <app-tabela-carros></app-tabela-carros>
            </section>
        </div>
    </div>
</div>
